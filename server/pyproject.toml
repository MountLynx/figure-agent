[project]
name = "figure-agent-server"
version = "0.1.0"
description = "figure-agent 本地服务：执行器、svgkit、REST API、会话"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figure_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
